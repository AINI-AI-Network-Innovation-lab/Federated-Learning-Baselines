[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-baselines"
version = "0.1.0"
description = "Extensible federated learning baselines built on Flower and PyTorch."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "flwr[simulation]==1.26.1",
    "numpy==2.3.3",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.flwr.app]
publisher = "local"

[tool.flwr.app.components]
serverapp = "fl_baselines.app.server_app:app"
clientapp = "fl_baselines.app.client_app:app"

[tool.flwr.app.config]
# Baseline selection
algorithm = "fedavg"

# Dataset selection
dataset = "mnist"
partitioner = "iid"
dirichlet-alpha = 0.5
seed = 42
data-dir = "data"
emnist-split = "balanced"

# Model selection
model = "mnist_cnn"
input-channels = 1
input-height = 28
input-width = 28
num-classes = 10

# Federation runtime
num-server-rounds = 3
num-supernodes = 10
fraction-train = 1.0
fraction-evaluate = 1.0
client-test-fraction = 0.2

# Client local training, shared by FedAvg/FedAvgM/FedAdp/FedExP/FedNova/FedPer/FedRep/FedProx/SCAFFOLD/MOON
local-epochs = 1
batch-size = 32
learning-rate = 0.01

# FedAvg
# No extra parameters.

# FedAvgM
server-learning-rate = 1.0
server-momentum = 0.9

# FedAdp
fedadp-alpha = 5.0

# FedDyn
feddyn-alpha = 0.1

# FedDC
feddc-alpha = 0.01

# FedDecorr
feddecorr-beta = 0.1

# FedExP
fedexp-epsilon = 0.001

# FedSpeed
fedspeed-lambda = 0.1
fedspeed-alpha = 1.0
fedspeed-rho = 0.1

# FedSAM
fedsam-rho = 0.5

# FedProto
fedproto-lambda = 1.0

# FedNTD
fedntd-beta = 1.0
fedntd-temperature = 1.0

# Ditto
ditto-lambda = 0.1

# pFedMe
pfedme-lambda = 15.0
pfedme-beta = 1.0
pfedme-personal-learning-rate = 0.01
pfedme-personal-steps = 5

# FedNova
fednova-server-momentum = 0.0

# FedPer
fedper-personal-layers = 1

# FedRep
fedrep-personal-layers = 1
fedrep-representation-epochs = 1

# FedProx
proximal-mu = 0.1

# SCAFFOLD
# No extra parameters.

# MOON
moon-mu = 1.0
moon-temperature = 0.5

# Artifacts and execution device
output-dir = "outputs"
device = "cpu"


#######################################################################
# CONFIGURATION MIGRATION NOTICE:
#
# What was previously called "federation config" for SuperLink
# connections in pyproject.toml has been renamed and moved.
#
# These settings are now **SuperLink connection configuration**
# and are defined in the Flower configuration file.
#
# The entries below are commented out intentionally and are kept
# only as a migration reference.
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
