[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-baselines"
version = "0.1.0"
description = "Extensible federated learning baselines built on Flower and PyTorch."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "flwr[simulation]==1.26.1",
    "numpy==2.3.3",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.flwr.app]
publisher = "local"

[tool.flwr.app.components]
serverapp = "fl_baselines.app.server_app:app"
clientapp = "fl_baselines.app.client_app:app"

[tool.flwr.app.config]
# Baseline selection
algorithm = "fedavg"

# Dataset selection
dataset = "mnist"
partitioner = "iid"
dirichlet-alpha = 0.5
seed = 42
data-dir = "data"
emnist-split = "balanced"

# Model selection
model = "mnist_cnn"
input-channels = 1
input-height = 28
input-width = 28
num-classes = 10

# Federation runtime
num-server-rounds = 3
num-supernodes = 10
fraction-train = 1.0
fraction-evaluate = 1.0
client-test-fraction = 0.2

# Client local training, shared by FedAvg/FedAvgM/FedAdp/FedExP/FedNova/FedPer/FedRep/FedProx/SCAFFOLD/MOON
local-epochs = 1
batch-size = 32
learning-rate = 0.01

# FedAvg
# No extra parameters.

# FedAvgM
server-learning-rate = 1.0
server-momentum = 0.9

# FedAdagrad
fedadagrad-eta = 0.1
fedadagrad-eta-l = 0.1
fedadagrad-tau = 1e-9

# FedAdam
fedadam-eta = 0.1
fedadam-eta-l = 0.1
fedadam-beta-1 = 0.9
fedadam-beta-2 = 0.99
fedadam-tau = 1e-9

# FedYogi
fedyogi-eta = 0.01
fedyogi-eta-l = 0.0316
fedyogi-beta-1 = 0.9
fedyogi-beta-2 = 0.99
fedyogi-tau = 0.001

# FedAdp
fedadp-alpha = 5.0

# FedDyn
feddyn-alpha = 0.1

# FedDC
feddc-alpha = 0.01

# FedDecorr
feddecorr-beta = 0.1

# FedExP
fedexp-epsilon = 0.001

# FedSpeed
fedspeed-lambda = 0.1
fedspeed-alpha = 1.0
fedspeed-rho = 0.1

# FedSAM
fedsam-rho = 0.5

# FedGEN
fedgen-alpha = 1.5
fedgen-lambda = 0.1
fedgen-beta = 0.9
fedgen-delta = 0.9
fedgen-warmup-epochs = 1
fedgen-l1-weight = 0.0001

# GAMF
gamf-sigma = 2.0
gamf-initial-tau = 0.05
gamf-descent-factor = 0.9
gamf-min-tau = 0.005
gamf-max-iters = 200

# FedMA
fedma-matching-epsilon = 0.0

# FedCDA
fedcda-memory-size = 3
fedcda-num-batches = 3
fedcda-warmup-rounds = 50
fedcda-loss-weight = 1.0

# FedDRL
feddrl-actor-learning-rate = 0.0001
feddrl-critic-learning-rate = 0.001
feddrl-discount-factor = 0.99
feddrl-target-tau = 0.02
feddrl-hidden-size = 256
feddrl-replay-buffer-size = 100000
feddrl-batch-size = 32
feddrl-updates-per-round = 1
feddrl-noise-scale = 0.1
feddrl-std-scale = 0.5

# FedEnt
fedent-beta = 0.99
fedent-gamma = 0.99
fedent-epsilon = 1e-8
fedent-fixed-point-steps = 1
fedent-max-learning-rate = 1.0
fedent-enable-decay = true

# FedLAW
fedlaw-server-epochs = 1
fedlaw-server-learning-rate = 0.01
fedlaw-gamma-init = 1.0

# FedAAW
fedaaw-beta = 0.01
fedaaw-gamma = 1.0
fedaaw-epsilon = 1e-8

# FedDisco
feddisco-discrepancy-weight = 0.5
feddisco-bias = 0.1
feddisco-metric = "kl"
feddisco-epsilon = 1e-8

# FedVCK
fedvck-condensed-ratio = 0.01
fedvck-condensed-steps = 1
fedvck-condensed-learning-rate = 0.1
fedvck-importance-alpha = 0.5
fedvck-server-replay-epochs = 1
fedvck-server-replay-learning-rate = 0.01
fedvck-contrastive-temperature = 0.1
fedvck-hard-negative-k = 1
fedvck-enable-latent-constraints = true
fedvck-max-memory-rounds = 4

# FedProto
fedproto-lambda = 1.0

# FedMeta
fedmeta-method = "maml"
fedmeta-inner-learning-rate = 0.01
fedmeta-outer-learning-rate = 0.001
fedmeta-support-fraction = 0.5
fedmeta-inner-steps = 1
fedmeta-first-order = true
fedmeta-alpha-init = 0.01

# FedNP
fednp-lambda = 0.1
fednp-prior-variance = 1.0
fednp-stability-eps = 1e-6

# FedCurv
fedcurv-lambda = 0.1
fedcurv-fisher-batches = 1
fedcurv-stability-eps = 1e-6

# FedMMD
fedmmd-sigma = 1.0
fedmmd-sknq-threshold = 0.5
fedmmd-min-clients = 2
fedmmd-entropy-eps = 1e-8

# APFL
apfl-alpha = 0.5
apfl-personal-learning-rate = 0.01
apfl-adaptive-alpha = true
apfl-alpha-learning-rate = 0.01

# FedNTD
fedntd-beta = 1.0
fedntd-temperature = 1.0

# FedLC
fedlc-tau = 0.5
fedlc-epsilon = 1e-8

# FedRS
fedrs-alpha = 0.5

# Ditto
ditto-lambda = 0.1

# pFedMe
pfedme-lambda = 15.0
pfedme-beta = 1.0
pfedme-personal-learning-rate = 0.01
pfedme-personal-steps = 5

# FedNova
fednova-server-momentum = 0.0

# FedPer
fedper-personal-layers = 1

# FedRep
fedrep-personal-layers = 1
fedrep-representation-epochs = 1

# FedALA
fedala-eta = 1.0
fedala-rand-percent = 80
fedala-layer-count = 1
fedala-threshold = 0.01
fedala-num-pre-loss = 10
fedala-start-max-steps = 100

# FedAMP
fedamp-lambda = 0.1
fedamp-alpha = 0.1
fedamp-sigma = 1.0

# FedLAA
fedlaa-beta = 5.0

# FedProx
proximal-mu = 0.1

# SCAFFOLD
# No extra parameters.

# MOON
moon-mu = 1.0
moon-temperature = 0.5

# Artifacts and execution device
output-dir = "outputs"
device = "cpu"


